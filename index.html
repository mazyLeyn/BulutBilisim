<style>

function pick(k){const q=Q[i];ans[i]=k;
document.querySelectorAll(".opt").forEach(b=>{if(inst){b.disabled=true;
if(b.dataset.k===q.a)b.classList.add("ok");else if(b.dataset.k===k)b.classList.add("no")}
else b.classList.toggle("sel",b.dataset.k===k)});
$("nx").disabled=false;
if(inst)$("sc").textContent=`Doğru: ${ans.filter((a,x)=>a===Q[x].a).length}`}
$("nx").onclick=()=>{i++;i>=Q.length?finish():show()};
$("quit").onclick=()=>{if(confirm("Testi bitirmek istiyor musun? Cevaplanmayanlar yanlış sayılır."))finish()};
function finish(){$("quiz").classList.add("hide");$("res").classList.remove("hide");
const n=Q.length,c=Q.filter((q,k)=>ans[k]===q.a).length,p=Math.round(c/n*100);
$("rs").textContent=`%${p}`;$("rt").textContent=`${n} sorudan ${c} doğru, ${n-c} yanlış veya boş.`;
$("rw").classList.toggle("hide",c===n);
$("rl").innerHTML=Q.map((q,k)=>{const ok=ans[k]===q.a;const u=ans[k]?`${ans[k]}) ${esc(q.o[ans[k]])}`:"Boş bırakıldı";
return `<div class="rv ${ok?"r":"w"}"><div><b>${k+1}.</b> ${esc(q.q)}</div>`+(ok?`<div class="g">✓ ${q.a}) ${esc(q.o[q.a])}</div>`:`<div class="b">Senin cevabın: ${u}</div><div class="g">Doğru: ${q.a}) ${esc(q.o[q.a])}</div>`)+`</div>`}).join("");scrollTo(0,0)}
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
$("rw").onclick=()=>begin(shuffle(Q.filter((q,k)=>ans[k]!==q.a)));
$("ra").onclick=()=>{$("res").classList.add("hide");$("home").classList.remove("hide");scrollTo(0,0)};
</script></body></html>
